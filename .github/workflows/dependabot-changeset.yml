name: Dependabot Changeset

on:
  workflow_run:
    workflows: [Changesets]
    types: [completed]
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/scripts/dependabot-changeset*
      - .github/workflows/dependabot-changeset.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-changeset-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Dependabot Changeset automation
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - run: node --test .github/scripts/dependabot-changeset.test.cjs

  note:
    name: Add the Dependabot release note
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: read

    outputs:
      head: ${{ steps.note.outputs.head }}
      pull-number: ${{ steps.note.outputs.pull-number }}
      note-paths: ${{ steps.note.outputs.note-paths }}

    steps:
      # Only default-branch code runs with write access; PR files remain API data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/github-script@v9
        id: note
        with:
          script: |
            const maintainNote = require('./.github/scripts/dependabot-changeset.cjs');
            await maintainNote({ github, context, core });

  validate:
    name: Parse the Dependabot release note
    needs: note
    if: needs.note.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      # The parser, package identity and tooling all come from the trusted base.
      # PR Markdown is read through the API as data; no PR code is executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - uses: actions/github-script@v9
        env:
          VALIDATED_HEAD: ${{ needs.note.outputs.head }}
          NOTE_PATHS: ${{ needs.note.outputs.note-paths }}
        with:
          script: |
            const { validateNotes } = require('./.github/scripts/dependabot-changeset.cjs');
            await validateNotes({
              github,
              context,
              head: process.env.VALIDATED_HEAD,
              paths: JSON.parse(process.env.NOTE_PATHS),
            });

  result:
    name: Report the Dependabot note check
    needs: [note, validate]
    if: always() && needs.note.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read
      checks: write

    steps:
      # This job never checks out or executes PR code.
      - uses: actions/github-script@v9
        env:
          PULL_NUMBER: ${{ needs.note.outputs.pull-number }}
          VALIDATED_HEAD: ${{ needs.note.outputs.head }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const { PULL_NUMBER, VALIDATED_HEAD, VALIDATION_RESULT } = process.env;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(PULL_NUMBER),
            });

            if (pr.state !== 'open' || pr.head.sha !== VALIDATED_HEAD) return;

            await github.rest.checks.create({
              ...context.repo,
              name: 'Validate Dependabot Changeset',
              head_sha: VALIDATED_HEAD,
              status: 'completed',
              conclusion: VALIDATION_RESULT === 'success' ? 'success' : 'failure',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Dependabot release-note validation',
                summary: `Changeset parsing: ${VALIDATION_RESULT}. This check does not replace version rehearsal, dependency tests, PHP compatibility checks or human review.`,
              },
            });
