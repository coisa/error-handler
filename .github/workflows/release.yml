name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'coisa/error-handler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:release
      - name: Publish only a merged version PR
        run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BEFORE: ${{ github.event.before }}
      - name: Check the current default-branch tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the version PR
        id: version
        if: steps.tip.outputs.current == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: npm run version:packages
          pr-title: 'chore: release coisa/error-handler'
          commit-message: 'chore: release coisa/error-handler'
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - name: Run CI on the generated version branch
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/master
