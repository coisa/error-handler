name: Changesets

on:
  pull_request:
    branches: [master]
  pull_request_target:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: changesets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate Changesets
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run changeset:status

      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2

      - name: Rehearse versioning in the disposable checkout
        if: steps.mode.outputs.mode == 'version'
        run: npm run version:packages

  status:
    name: Read PR Changesets
    if: ${{ github.event_name == 'pull_request_target' && !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      comment-body: ${{ steps.status.outputs.comment-body }}

    steps:
      # Check out the trusted base; the action only reads PR files.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate Changeset status
        id: status
        uses: changesets/action/pr-status@v2

  comment:
    name: Comment PR Changesets
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Create or update the Changeset comment
        uses: changesets/action/pr-comment@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ needs.status.outputs.comment-body }}

  version:
    name: Prepare version PR
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Check the current master tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the version PR
        id: version
        if: steps.tip.outputs.current == 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version:packages
          pr-title: 'chore: version ${{ github.repository }}'
          commit-message: 'chore: version ${{ github.repository }}'
          create-github-releases: false
          push-git-tags: false

      - name: Describe the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'Prepare the next version of %s.\n\n' "$REPOSITORY" > "$RUNNER_TEMP/version-pr.md"

          cat >> "$RUNNER_TEMP/version-pr.md" <<'MARKDOWN'
          Review the generated `CHANGELOG.md`, the versions in `package.json` and
          `package-lock.json`, and the consumed `.changeset/*.md` notes.

          Merging this PR updates release metadata only. Git tags and GitHub releases
          remain a separate maintainer step. The private npm package is never published.
          MARKDOWN

          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/version-pr.md"

      - name: Validate the generated version branch
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run changesets.yml --ref changeset-release/master
