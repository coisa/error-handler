name: Changesets

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: changesets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run changeset:status

      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2

      - name: Rehearse versioning in the disposable checkout
        if: steps.mode.outputs.mode == 'version'
        run: npm run version:packages
