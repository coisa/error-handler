name: Changesets

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: changesets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate pending notes and read the release plan
        id: plan
        run: |
          npm run changeset:status -- --output="$RUNNER_TEMP/changeset-status.json"
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/changeset-status.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pending=${plan.releases.length > 0}\n`);
          NODE
      - name: Rehearse versioning in the disposable checkout
        if: steps.plan.outputs.pending == 'true'
        run: npm run version:packages
