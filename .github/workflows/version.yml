name: Version PR

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: version-master
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'coisa/error-handler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the current master tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the version PR
        id: version
        if: steps.tip.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version:packages
          pr-title: 'chore: version coisa/error-handler'
          commit-message: 'chore: version coisa/error-handler'
          create-github-releases: false
          push-git-tags: false
      - name: Describe the Composer version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          gh pr edit "$PR_NUMBER" --body-file - <<'MARKDOWN'
          Prepare the next version of the `coisa/error-handler` Composer package.

          Review the generated `CHANGELOG.md`, the versions in `package.json` and
          `package-lock.json`, and the consumed `.changeset/*.md` notes.

          Merging this PR updates release metadata only. Git tags and GitHub releases
          remain a separate maintainer step. The private npm package is never published.
          MARKDOWN
      - name: Validate the generated version branch
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run changesets.yml --ref changeset-release/master
